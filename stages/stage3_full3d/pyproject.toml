[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-traction-mpc-stage3-full3d"
version = "0.1.0"
description = "Independent torque-actuated UR10e robot core for Stage 3."
requires-python = ">=3.10"
dependencies = [
    "mujoco",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
