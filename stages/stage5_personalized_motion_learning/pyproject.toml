[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-traction-mpc-stage5"
version = "0.1.0"
description = "Provisional laboratory geometry and stiff-interface validation for Stage 5."
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "mujoco",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
