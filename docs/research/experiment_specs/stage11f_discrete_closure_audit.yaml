# Approved exploratory experiment contract. Complete execution remains reserved
# for the user.
experiment_id: stage11f_discrete_closure_audit
title: Exact discrete one-step closure audit
status: approved_exploratory

research_question: Is the remaining structured lambda bias introduced mainly by the continuous-time finite-difference affine regression, or is it already present in the exact discrete simulator transition?

authoritative_inputs:
  replay: results/stage9j_gap_decomposition/stage9j_replay.csv
  stage11c_manifest: results/stage11c_state_source_audit/run_manifest.json
  stage11c_profiles: results/stage11c_state_source_audit/paired_profile_summary.csv
  stage11d_manifest: results/stage11d_residual_coverage_audit/run_manifest.json
  stage11d_diagnostics: results/stage11d_residual_coverage_audit/window_residual_diagnostics.csv
  reviewed_stage11e_manifest: results/stage11e_block_coverage_calibration/run_manifest.json
  reviewed_stage11e_summary: results/stage11e_block_coverage_calibration/condition_calibration_summary.csv

baseline:
  method: Unchanged Stage 11D true-parameter affine residual
  channel_order: [radial, angular]
  row_square_root_weights: [0.6, 0.25]

treatment:
  method: Exact discrete one-step replay closure
  transition_function: traction_mpc.models.spring2d_dynamics.step_dynamics
  replay_generation_call_path: Spring2DEnv.step -> step_dynamics
  transition_alignment: recorded action at replay index t maps true state t-1 to true state t
  residual_sign: predicted next state minus replay true next state

fixed_variables:
  - Stage 9J replay
  - exact Stage 11C/11D 24-run and 710-window identities
  - replay true states and recorded actions
  - true condition parameters and dt
  - Stage 11D affine truth residual
  - controller, estimator, identifier, weights, and parameterization

discrete_residual_contract:
  raw_state_order: [theta, omega, r, r_dot]
  raw_residual: predicted x_(t+1) minus replay true x_(t+1)
  radial_acceleration_equivalent: r_dot one-step residual divided by dt
  angular_acceleration_equivalent: omega one-step residual divided by dt
  affine_channel_order: [radial, angular]
  row_square_root_weights: [0.6, 0.25]
  combined_weighted_rms: RMS over the interleaved weighted radial/angular rows
  primary_metric: discrete_to_affine_weighted_rms_ratio

forbidden:
  - duplicating or approximating the simulator dynamics or RK4 integration
  - parameter fitting or optimization
  - estimator, identifier, or controller invocation
  - changing replay, actions, alignment, weights, parameterization, or dt

primary_metrics:
  - raw theta, omega, r, and r_dot one-step residuals
  - radial and angular acceleration-equivalent residuals
  - discrete weighted residual RMS
  - unchanged affine truth weighted residual RMS
  - discrete_to_affine_weighted_rms_ratio
  - condition-level median ratios

human_review_criteria:
  finite_difference_continuous_regression_bias_supported:
    overall_median_ratio_maximum: 0.01
    conditions_with_median_ratio_at_most_0_05_minimum: 7
    total_conditions: 8
  discrete_model_mismatch_retained:
    any_of:
      - overall_median_ratio_minimum: 0.25
      - conditions_with_median_ratio_at_least_0_25_minimum: 4
    total_conditions: 8
  otherwise: inconclusive
  automatic_application: forbidden

expected_outputs:
  - window_discrete_closure_metrics.csv
  - condition_discrete_closure_summary.csv
  - stage11f_report.md
  - run_manifest.json
  - command.txt
  - mechanical_status.json

mechanical_completeness:
  source_provenance:
    - Stage 11C and Stage 11D manifests must be valid_full_run.
    - The reviewed Stage 11E manifest must be valid_full_run.
    - Current replay, config, Stage 11B runner, Stage 11D runner, and simulator transition hashes must match saved or recorded provenance.
    - Current Stage 11C manifest and profile hashes must match Stage 11D provenance.
  exact_identity_matrix:
    runs: 24
    windows: 710
    run_identity: [condition, seed]
    window_identity: [condition, seed, window_start, window_end]
    requirements:
      - Stage 11C and Stage 11D exact window identity sets are equal.
      - No duplicate source or output window rows exist.
      - Every output window contains exactly 70 aligned transitions.
      - Every transition uses true x_(t-1), recorded action[t], and true x_t.
      - Every transition uses the true Stage 9J condition parameters and dt.
      - Every recorded action is already within the environment action limits.
      - Radial and angular channels use the unchanged Stage 11D order and weights.
      - No estimator, optimizer, parameter fit, or identifier is invoked.
  validity:
    - Full output is valid_full_run only when every mechanical check and required output passes.
    - A full run is formal evidence awaiting review and is never automatically authoritative.

reporting:
  interpretation: Neutral descriptive metrics only
  automatic_scientific_classification: forbidden
  limitations:
    - The audit diagnoses replay closure and does not test closed-loop performance.
    - It assumes the saved replay action equals the environment-applied action; this is mechanically checked against action limits.
    - The acceleration-equivalent discrete residual and affine residual retain the preregistered row weighting but arise from different residual constructions.

smoke_execution:
  command: conda run -n mpc_learn python scripts/run_stage11f_discrete_closure_audit.py --smoke
  output_root: results/local/stage11f_discrete_closure_audit_smoke
  maximum_runs: 1
  maximum_windows: 3
  authoritative: false
  performed_by: Codex when explicitly authorized

complete_execution:
  command: conda run -n mpc_learn python scripts/run_stage11f_discrete_closure_audit.py --full
  output_root: results/stage11f_discrete_closure_audit
  performed_by: user
  requires_committed_implementation: true
  overwrite_existing_output: forbidden
  automatic_authoritative_promotion: forbidden

result_status: implementation_pending_validation
