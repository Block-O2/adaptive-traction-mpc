# Approved exploratory experiment contract. Complete execution remains reserved
# for the user.
experiment_id: stage11e_block_coverage_calibration
title: Block-aware lambda coverage calibration audit
status: approved_exploratory

research_question: How much of the true-state lambda undercoverage is explained by temporally dependent residuals, without changing the weighted least-squares point estimate?

authoritative_inputs:
  replay: results/stage9j_gap_decomposition/stage9j_replay.csv
  stage11c_manifest: results/stage11c_state_source_audit/run_manifest.json
  stage11c_profiles: results/stage11c_state_source_audit/paired_profile_summary.csv
  stage11d_manifest: results/stage11d_residual_coverage_audit/run_manifest.json
  stage11d_diagnostics: results/stage11d_residual_coverage_audit/window_residual_diagnostics.csv

baseline:
  method: Existing Stage 11C true-state one-dimensional lambda profile interval
  point_estimate: Existing true-state weighted least-squares optimum
  profile_calculation: Unchanged

treatment:
  method: Transition-level circular moving-block score bootstrap
  interval_center: Unchanged weighted least-squares lambda optimum
  interval_half_width: Empirical 95th percentile of absolute bootstrap lambda displacement

fixed_variables:
  - Stage 9J replay and exact Stage 11C window identities
  - true-state affine H and y construction
  - actions and alignment
  - 70-transition windows
  - row square-root weights [0.6, 0.25]
  - affine parameter order [lambda, kappa, beta]
  - weighted least-squares optimum
  - Stage 11C profile curvature and baseline interval
  - all controller and estimator code

bootstrap_contract:
  channel_grouping: Keep the two weighted regression channels paired by transition.
  transition_score: psi_t = H_w,t^T e_w,t, summed across the two channels belonging to transition t
  resampling: Circular moving blocks of transitions
  block_length: 10
  replicates_per_window: 2000
  global_seed: 20260725
  per_window_seed: Deterministic SHA-256 derivation from the global seed and exact window identity
  sampled_length: Concatenate blocks and truncate to exactly 70 transitions
  displacement: delta_theta_star = -(H_w^T H_w)^-1 sum_t psi_t_star
  lambda_half_width_quantile: 0.95
  forbidden:
    - resampling scalar interleaved channels separately
    - refitting or changing the original weighted least-squares optimum
    - using truth lambda to choose block length, replicate count, seed, threshold, or interval
  truth_usage: Evaluate coverage only after interval construction.

primary_metrics:
  - baseline lambda truth coverage
  - calibrated lambda truth coverage
  - absolute coverage gain
  - baseline and calibrated relative width
  - width inflation factor
  - condition-level consistency
  - fraction of windows whose point estimate changed

human_review_criteria:
  H1_materially_supported:
    overall_coverage_gain_minimum: 0.20
    conditions_with_gain_at_least_0_10_minimum: 6
    total_conditions: 8
  H1_weakly_supported_or_inconclusive: Intermediate results
  H1_insufficient:
    overall_coverage_gain_strictly_below: 0.10
    conditions_with_gain_at_least_0_10_strictly_fewer_than: 4
    total_conditions: 8
  practical_calibration:
    overall_coverage_minimum: 0.85
    median_width_inflation_maximum: 5
  automatic_application: forbidden

expected_outputs:
  - window_calibration_metrics.csv
  - condition_calibration_summary.csv
  - stage11e_report.md
  - run_manifest.json
  - command.txt
  - mechanical_status.json

mechanical_completeness:
  source_provenance:
    - Stage 11C and Stage 11D manifests must be valid_full_run.
    - Current replay, config, Stage 11B runner, and Stage 11D runner hashes must match saved provenance.
    - Current Stage 11C manifest and profile hashes must match the Stage 11D manifest.
  exact_identity_matrix:
    runs: 24
    windows: 710
    run_identity: [condition, seed]
    window_identity: [condition, seed, window_start, window_end]
    requirements:
      - Stage 11C and Stage 11D window identity sets are exactly equal.
      - No duplicate source or output window rows exist.
      - Every output window uses true state and exactly 70 transitions.
      - Every output window uses paired transition scores.
      - Every bootstrap replicate contains exactly 70 transition indices.
      - Every output window uses block length 10 and 2000 replicates.
      - Reconstructed weighted least-squares lambda matches Stage 11C and Stage 11D within absolute tolerance 1e-10.
      - Point-estimate changed fraction is exactly zero.
  validity:
    - Full output is valid_full_run only when every mechanical check and required output passes.
    - A full run is formal evidence awaiting review and is never automatically authoritative.

reporting:
  interpretation: Neutral descriptive metrics only
  automatic_hypothesis_choice: forbidden
  automatic_scientific_classification: forbidden
  limitations:
    - Passive rehabilitation trajectories only; no active excitation.
    - True-state regression is an oracle diagnostic, not a deployable estimator.
    - One fixed block length is tested; no data-driven block selection is performed.

smoke_execution:
  command: conda run -n mpc_learn python scripts/run_stage11e_block_coverage_calibration.py --smoke
  output_root: results/local/stage11e_block_coverage_calibration_smoke
  maximum_runs: 1
  maximum_windows: 3
  authoritative: false
  performed_by: Codex when explicitly authorized

complete_execution:
  command: conda run -n mpc_learn python scripts/run_stage11e_block_coverage_calibration.py --full
  output_root: results/stage11e_block_coverage_calibration
  performed_by: user
  requires_committed_implementation: true
  overwrite_existing_output: forbidden
  automatic_authoritative_promotion: forbidden

reviewed_result:
  mechanical_status: valid_full_run
  runs: 24
  windows: 710
  baseline_lambda_coverage: 0.494
  calibrated_lambda_coverage: 0.266
  absolute_coverage_gain: -0.228
  conditions_with_gain_at_least_0_10: 0
  total_conditions: 8
  median_width_inflation: 0.649
  point_estimate_changed_fraction: 0
  human_review:
    H1: insufficient under the preregistered block-aware treatment
    practical_calibration: failed
    branch_decision: close the simple serial-correlation calibration branch
    active_explanation: structured point-bias H2

result_status: reviewed_h1_insufficient_branch_closed
