<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive Traction MPC: control loop and research extensions</title>
  <desc id="desc">Stage 3–4 on main: coupled MuJoCo plant, robot-facing measurements, effective-dynamics estimation and trust, constrained MPC, safety and robot torque feedback. Later Stage-5 motion planning and optional learning interfaces remain in the archive. Simulator human truth is used only for evaluation.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#336b75"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #18303e; }
      .heading { font-size: 30px; font-weight: 650; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #4d6470; }
      .label { font-size: 13px; font-weight: 650; letter-spacing: 1.3px; fill: #336b75; }
      .node-title { font-size: 19px; font-weight: 650; }
      .node { fill: #fff; stroke: #cbd9dd; stroke-width: 1.4; }
      .flow { fill: none; stroke: #336b75; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="670" rx="20" fill="#f5f8f8"/>
  <text x="40" y="56" class="heading">From measurements to executable motion</text>
  <text x="40" y="85" class="body">A simulation research platform under development</text>
  <text x="40" y="139" class="label">STAGE 3–4 · IMPLEMENTED ON MAIN</text>

  <rect x="40" y="166" width="200" height="130" rx="12" class="node"/>
  <text x="58" y="200" class="node-title">Coupled plant</text>
  <text x="58" y="230" class="body">MuJoCo robot + leg</text>
  <text x="58" y="254" class="body">Cuff + support surface</text>
  <text x="58" y="278" class="small">UR10e surrogate / Human V2</text>

  <rect x="270" y="166" width="200" height="130" rx="12" class="node"/>
  <text x="288" y="200" class="node-title">Measurements</text>
  <text x="288" y="230" class="body">Robot state / cuff pose</text>
  <text x="288" y="254" class="body">Reconstructed wrench</text>
  <text x="288" y="278" class="small">Causal sensor boundary</text>

  <rect x="500" y="166" width="200" height="130" rx="12" class="node"/>
  <text x="518" y="200" class="node-title">Estimation + trust</text>
  <text x="518" y="230" class="body">Human state estimate</text>
  <text x="518" y="254" class="body">Effective dynamics</text>
  <text x="518" y="278" class="small">Prior / qualified challenger</text>

  <rect x="730" y="166" width="200" height="130" rx="12" class="node"/>
  <text x="748" y="200" class="node-title">Constrained MPC</text>
  <text x="748" y="230" class="body">Human-space planning</text>
  <text x="748" y="254" class="body">Tracking + constraints</text>
  <text x="748" y="278" class="small">Original controller contract</text>

  <rect x="960" y="166" width="200" height="130" rx="12" class="node"/>
  <text x="978" y="200" class="node-title">Safety + execution</text>
  <text x="978" y="230" class="body">Filter / BRAKE / allocator</text>
  <text x="978" y="254" class="body">Robot torque command</text>
  <text x="978" y="278" class="small">Separate velocity feedback</text>

  <path d="M240 218H265" class="flow"/>
  <path d="M470 218H495" class="flow"/>
  <path d="M700 218H725" class="flow"/>
  <path d="M930 218H955" class="flow"/>
  <path d="M1060 296V342H140V301" class="flow"/>
  <text x="445" y="331" class="small">Robot actuation closes the simulated feedback loop</text>
  <text x="40" y="382" class="small">Simulator human truth → offline evaluation only; no truth input to the controller</text>

  <text x="40" y="431" class="label">LATER STAGE-5 SNAPSHOT · LINKED ARCHIVE · NOT INTEGRATED INTO MAIN</text>
  <rect x="40" y="451" width="710" height="132" rx="12" fill="#e9f1f2" stroke="#c2d6da"/>
  <text x="60" y="483" class="node-title">Motion planning and protected execution</text>
  <text x="60" y="512" class="body">Waypoint MPC → quintic scheduler / governor → current-state admission</text>
  <text x="60" y="538" class="body">Feedback / allocation → applied commands and native receipts</text>
  <text x="60" y="563" class="small">Age, phase, versions, carry, braking and fallback remain part of execution</text>

  <rect x="780" y="451" width="380" height="132" rx="12" fill="#fff" stroke="#9db7bf" stroke-dasharray="6 5"/>
  <text x="800" y="483" class="node-title">Optional research interfaces</text>
  <text x="800" y="512" class="body">Coordination / Value / Q / imitation / RL</text>
  <text x="800" y="538" class="body">Motion intent or candidate ranking</text>
  <text x="800" y="563" class="small">Separate snapshots and action contracts</text>
  <path d="M780 520H755" class="flow" stroke-dasharray="5 4"/>
  <text x="40" y="623" class="body">Scientific simulation ≠ host-clock qualification ≠ hardware or clinical validation</text>
  <text x="40" y="649" class="small">See docs/architecture.md for exact boundaries, time scales and source links.</text>
</svg>
